<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Stylish and Functional Alarm Clock" />
    <title>Modern Alarm Clock</title>

    <!-- Favicon -->
    <link rel="icon" href="alarm-clock.png" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="alarm.css" />
</head>
<body>
    <div class="overlay">
        <div class="clock-wrapper">
            <h1 class="clock-title">⏰ Alarm Clock</h1>
            
            <!-- Display Current Time -->
            <div class="current-time" id="current-time">_ : _ : _</div>
            
            <!-- Alarm Set Form -->
            <form class="alarm-form">
                <select id="hours" required></select>
                <select id="minutes" required></select>
                <select id="seconds" required></select>
                <select id="am-pm" required>
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                </select>
                <button id="submitButton" type="submit" class="btn-set">Set Alarm</button>
            </form>
            
            <!-- Display Set Alarms -->
            <div class="alarm-list">
                <h2 class="alarm-list-title">Scheduled Alarms</h2>
                <div id="alarms-container" class="alarms-container"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="alarm.js"></script>
</body>
</html>
